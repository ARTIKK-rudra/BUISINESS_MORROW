[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morrow-api"
version = "0.1.0"
description = "Business command center API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.4,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT>=2.9,<3.0",
  "email-validator>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "aiokafka>=0.12,<1.0",
  "pytesseract>=0.3.13,<1.0",
  "Pillow>=10.4,<13.0",
  "python-multipart>=0.0.12,<1.0",
  "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "httpx>=0.27,<1.0", "aiosqlite>=0.20,<1.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
